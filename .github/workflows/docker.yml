name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref makes the running build pointless.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        # npm ci needs a lockfile. Commit package-lock.json to get reproducible
        # installs here and in the Dockerfile; until then fall back to install.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::No package-lock.json committed - installs are not reproducible."
            npm install --no-audit --no-fund
          fi

      - name: Run tests
        run: npm test

  build:
    name: Build, scan and push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Only needed to emulate linux/arm64 on the amd64 runner.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      # Pull requests from forks get no package write access, so skip the login
      # and build without pushing.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Lowercased automatically, which matters because GHCR rejects
          # uppercase paths and GitHub usernames may contain capitals.
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=hertha-cal
            org.opencontainers.image.description=Kalender-Abo mit allen Pflichtspielen von Hertha BSC

      # Built and scanned before anything is pushed - a vulnerable image must
      # never reach the registry in the first place.
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          # Single platform on purpose: buildx cannot load a multi-arch image
          # into the local daemon, and OS packages and npm dependencies are
          # identical across the two architectures anyway.
          platforms: linux/amd64
          load: true
          tags: hertha-cal:scan
          cache-from: type=gha
          provenance: false

      - name: Scan image with Trivy
        # Tags in this action are v-prefixed - a bare "0.28.0" does not resolve.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hertha-cal:scan
          # Authenticates the vulnerability DB pull from ghcr.io. Anonymous
          # pulls share a rate limit that CI runners hit regularly.
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          # Anything HIGH or above fails the job and blocks the push.
          exit-code: '1'
          # Set to 'true' to gate only on vulnerabilities that actually have a
          # fix available. Left off so nothing HIGH or above passes silently.
          ignore-unfixed: 'false'
          format: table
          output: trivy-report.txt

      - name: Add scan result to the run summary
        # Runs on success and on failure - the report matters most when the
        # gate has just blocked a push.
        if: always()
        run: |
          {
            echo "### Trivy scan (HIGH and CRITICAL)"
            echo
            echo '```'
            if [ ! -f trivy-report.txt ]; then
              # Never report a clean bill of health for a scan that never ran.
              echo "No report was produced - the scan step itself failed. See its log."
            elif [ -s trivy-report.txt ]; then
              # The step summary caps out at 1 MB.
              head -c 200000 trivy-report.txt
            else
              echo "No HIGH or CRITICAL vulnerabilities found."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance attestations would add "unknown/unknown" entries to the
          # package listing in the GitHub UI, which only causes confusion here.
          provenance: false

      - name: Summarise
        if: github.event_name != 'pull_request'
        # Values go through the environment rather than straight into the script,
        # so a ref name can never be interpreted as shell.
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            printf '%s\n' "$IMAGE_TAGS"
            echo '```'
            echo
            printf 'Digest: `%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
